[workspace]
resolver = "3"
members = [
    "crates/playtest-core",
    "crates/playtest-ports",
    "crates/playtest-adapters",
    "crates/playtest-agents",
    "crates/playtest-api",
    "crates/playtest-log",
    "crates/playtest-metrics",
    "crates/playtest-cli",
    "crates/games/cribbage",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ozten/playtester"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Workspace-internal
playtest-core = { path = "crates/playtest-core" }
playtest-ports = { path = "crates/playtest-ports" }
playtest-adapters = { path = "crates/playtest-adapters" }
playtest-agents = { path = "crates/playtest-agents" }
playtest-api = { path = "crates/playtest-api" }
playtest-log = { path = "crates/playtest-log" }
playtest-metrics = { path = "crates/playtest-metrics" }
playtest-cribbage = { path = "crates/games/cribbage" }

[profile.release]
lto = "thin"
codegen-units = 1
